    parser_type: html
    verified: true
    selectors:
      list_item: ul.list_base li, div.news_list li, .list-item
      title: a
      link: a
      date: span

  - id: xm_hrss
    city: 厦门
    district: 全市
    source_name: 厦门市人力资源和社会保障局 (毕业生补贴)
    category: subsidy
    url: https://hrss.xm.gov.cn/xxgk/tzgg/
    parser_type: html
    verified: true
    selectors:
      list_item: ul li, div.news_list li, .list-item
      title: a
      link: a
      date: span

  # ---------------------------------------------------------------- 南京 ----
  - id: nj_housing
    city: 南京
    district: 全市
    source_name: 南京市住房保障和房产局 (保障房/人才安居)
