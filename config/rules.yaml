      link: a
      date: span

  # ---------------------------------------------------------------- 厦门 ----
  # 实测状态：住房保障局抓到 15 条，人社局抓到 7 条
  - id: xm_housing
    city: 厦门
    district: 全市
    source_name: 厦门市住房和建设局 (保租房/人才公寓)
    category: housing
