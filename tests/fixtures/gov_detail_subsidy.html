<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>关于发放2026年应届高校毕业生生活补贴的公告</title></head>
<body>
<div id="zoom">
  <p>根据我市人才引进政策，现就2026年应届高校毕业生生活补贴发放工作公告如下：</p>
  <p>一、补贴对象</p>
  <p>2026年毕业并在我市就业创业的全日制应届高校毕业生，包括大专、本科、硕士、博士各学历层次。</p>
  <p>二、补贴标准</p>
  <p>一次性生活补贴标准为：博士 10 万元，硕士 5 万元，本科 2 万元，大专 1 万元。</p>
  <p>三、申报期限</p>
  <p>申报截止日期为 2026年10月15日，请符合条件的毕业生在截止日期前完成线上申报。</p>
  <p>四、办理方式</p>
  <p>通过“示例市人社局微信公众号”进入毕业生服务专区办理。</p>
</div>
</body>
</html>
